<!doctype html><html lang="ja"><head><meta charset="utf-8"><base href="../public/"><title>REQUIEM / 8体のボス機構検証</title><style>
body{margin:0;background:#03080e;color:#d4e4e8;font:12px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;top:18px;left:22px;padding:16px 20px;background:#03101bed;border:1px solid #708da54d;max-width:400px}h1{font:16px monospace;letter-spacing:2px}button,select{padding:7px 10px;margin:3px;background:#122d3b;color:#dce4df;border:1px solid #64808b;cursor:pointer}output{display:block;white-space:pre-wrap;font:11px/1.8 monospace;color:#9eb7c5;margin:10px 0}p{font-size:11px;line-height:1.8;color:#a9bcc0}.badge{position:fixed;bottom:30px;left:30px;font:14px monospace;letter-spacing:3px;color:#cfb689}#status{color:#ffd494}aside.hidden{display:none}</style></head><body><canvas id="view"></canvas><aside><h1>BOSS MECHANISM REVIEW</h1><select id="stage" aria-label="検証するボス"></select><button id="next">次のボス</button><br><button id="guard">防御</button><button id="open">核露出</button><button id="attack">予告攻撃</button><button id="break">部位破壊</button><button id="phase">第2段階</button><br><button id="pilot">操作ボットを実行</button><button id="freeze">停止</button><button id="step">0.5秒進める</button><button id="clean">画面を保存用表示</button><output id="result">LOADING</output><p id="hint"></p><p id="status"></p></aside><div class="badge" id="badge"></div><script type="module" src="/.cache/boss-lab.js"></script></body></html>
